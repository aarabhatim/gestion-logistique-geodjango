version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: logistique_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      DB_HOST: db
      DB_NAME: logistique_db
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379
      DJANGO_SETTINGS_MODULE: logistique_backend.settings
      DEBUG: "True"
      SECRET_KEY: delivermap-secret-change-in-production
      OSRM_BASE_URL: http://router.project-osrm.org
      PLATFORM_COMMISSION_RATE: "0.15"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt -q &&
             python manage.py migrate --noinput &&
             python manage.py seed_delivermap &&
             python -m daphne -b 0.0.0.0 -p 8000 logistique_backend.asgi:application"

  celery:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db
      DB_NAME: logistique_db
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_URL: redis://redis:6379
      DJANGO_SETTINGS_MODULE: logistique_backend.settings
    depends_on:
      - redis
      - db
    command: celery -A logistique_backend worker -l info

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000/api/
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_files:
